services:

  # ------------------------------------------------------------
  #              Incoming/outgoing traffic endpoints
  # ------------------------------------------------------------
  knfexchange-endpoint:
    container_name: knfexchange-endpoint
    image: caddy:2.11-alpine
    user: 1000:1000
    read_only: true
    volumes:
      - ./endpoint/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      ############################ SISTEMOS PASSWORD #######################
      APP_PASSWORD_1: GUI_PASSWORD_HERE
      ######################################################################
    ports:
      - 80:80
    networks:
      - isolated
      - external
    restart: unless-stopped


  knfexchange-exit:
    container_name: knfexchange-exit
    image: vuknf/caddy-l4:2.11
    user: 1000:1000
    read_only: true
    volumes:
      - ./exit/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      external: {}
      isolated:
        ipv4_address: 172.18.123.30
    restart: unless-stopped
  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # ------------------------------------------------------------






  # ------------------------------------------------------------
  #                     Students gate
  # ------------------------------------------------------------
  knfexchange-login:
    container_name: knfexchange-login
    image: vuknf/simple-login-page:20260924
    environment:
      VITE_SYSTEM_NAME: "VU KNF Coin<br/>Bandymų Platforma"
    networks:
      - isolated
    restart: unless-stopped
  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # ------------------------------------------------------------











  # ------------------------------------------------------------
  #                          DNS Server
  # ------------------------------------------------------------
  knfexchange-dns:
    container_name: knfexchange-dns
    image: dockurr/dnsmasq:2.92
    user: 1000:1000
    read_only: true
    entrypoint: ["dnsmasq", "--no-daemon"]
    command:
      - --no-resolv
      - --no-hosts
      - --local=/#/
      - --address=/#/172.18.123.30
    networks:
      isolated:
        ipv4_address: 172.18.123.31
    restart: unless-stopped
  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # ------------------------------------------------------------













  # ------------------------------------------------------------
  #                   Crypto exchange services
  # ------------------------------------------------------------
  knfexchange-vite:
    container_name: knfexchange-vite

    # Docker hub
    image: vuknf/knfexchange-vite:latest

    # # Self-built
    # image: knfexchange-vite
    # build:
    #   context: ./vite
    #   # dockerfile: Dockerfile                                                         # Prod
    #   dockerfile: Dockerfile.dev                                                     # Dev

    user: 1000:1000
    read_only: true
    # tmpfs:                                                                           # Dev
    #   - /home/node/.npm:uid=1000,gid=1000                                            # Dev
    # volumes:                                                                         # Dev
    #   - ./vite/app:/app                                                              # Dev
    networks:
      - isolated
      # - external                                                                     # Dev
    restart: unless-stopped


  knfexchange-backend:
    container_name: knfexchange-backend

    # Docker hub
    image: vuknf/knfexchange-backend:latest

    # # Self-built
    # image: knfexchange-backend
    # build: ./backend

    user: 1000:1000
    read_only: true
    environment:
      # - APP_DEBUG=True                                                               # Dev
      - EXCHANGE_PRIVATE_KEY=${EXCHANGE_PRIVATE_KEY}
    tmpfs:
      - /.bitcoinlib:uid=1000,gid=1000
    volumes:
      # Configuration
      - /etc/localtime:/etc/localtime:ro
      - ./_CONFIG:/config:ro

      # Backend Database
      - ./_DATA/exchange:/data
      
      # Backend Source Code
      # - ./backend:/app                                                               # Dev
    dns:
      - 172.18.123.31
    networks:
      - isolated
      # - external                                                                     # Dev
    restart: unless-stopped
  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # ------------------------------------------------------------











  # ------------------------------------------------------------
  #                   Block explorer services
  # ------------------------------------------------------------
  knfexchange-explorer:
    container_name: knfexchange-explorer
    image: vuknf/knfcoin-explorer:20261028
    user: 1000:1000
    read_only: true
    environment:
      BTCEXP_COIN: KNF
      BTCEXP_HOST: 0.0.0.0
      BTCEXP_RPC_CONCURRENCY: 10
      BTCEXP_BASEURL: /explorer/
      BTCEXP_FILESYSTEM_CACHE_DIR: /tmp/cache

      BTCEXP_BITCOIND_URI: bitcoin://admin:admin@knfexchange-fullnode:19332?timeout=10000
      BTCEXP_ADDRESS_API: electrum
      BTCEXP_ELECTRUM_SERVERS: ssl://ip-158-129-172-247--49002:49002
      BTCEXP_SLOW_DEVICE_MODE: false
    tmpfs:
      - /tmp
    dns:
      - 172.18.123.31
    networks:
      - isolated
      # - external                                                                     # Dev
    restart: unless-stopped


  knfexchange-fullnode:
    container_name: knfexchange-fullnode
    image: vuknf/knfcoin-fullnode:20260713
    volumes:
      - ./_DATA/fullnode:/root/.litecoin
    command:
      [
        "knfcoind",
        "-server=1",
        "-txindex=1",
        "-rpcuser=admin",
        "-rpcpassword=admin",
        "-rpcallowip=172.0.0.0/8",
        "-rpcport=19332",
        "-rpcbind=0.0.0.0",
        "-dbcache=512",
        "-checkblocks=6",
        "-dnsseed=0",
        "-addnode=ip-158-129-172-247--49333:49333"
      ]
    dns:
      - 172.18.123.31
    networks:
      - isolated
      # - external                                                                     # Dev
    stop_grace_period: 15m
    restart: unless-stopped
  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # ------------------------------------------------------------









  # ------------------------------------------------------------
  #              Additional administration services 
  # ------------------------------------------------------------
  knfexchange-dbgate:
    container_name: knfexchange-dbgate
    image: dbgate/dbgate:7.3.2
    user: root
    read_only: true
    environment:
      WEB_ROOT: /dbgate

      LOGINS: admin
      LOGIN_PASSWORD_admin: ${DBGATE_PASSWORD}

      CONNECTIONS: con1
      LABEL_con1: KNF Exchange Playground
      FILE_con1: /root/db/exchange.db
      ENGINE_con1: sqlite@dbgate-plugin-sqlite

    volumes:
      - ./_DATA/exchange:/root/db
    networks:
      - isolated
    restart: unless-stopped
  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # ------------------------------------------------------------







networks:
  external:
    name: external
    external: true
  isolated:
    name: knfexchange-isolated
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.18.123.0/24
          gateway: 172.18.123.1
